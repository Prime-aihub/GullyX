<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GullyX Nearby Games</title>

  <link rel="stylesheet" href="style.css">

  <style>

    #map {

      width: 100%;
      height: 100vh;

    }

  </style>

</head>

<body>

  <div id="map"></div>

  <script>

    function initMap() {

      const location = {

        lat: 19.0330,
        lng: 73.0297

      };

      const map = new google.maps.Map(document.getElementById("map"), {

        zoom: 13,
        center: location

      });

      new google.maps.Marker({

        position: location,
        map: map,
        title: "Live Match Nearby"

      });

    }

  </script>

  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap">
  </script>

</body>

</html>
