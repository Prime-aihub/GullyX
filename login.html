<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GullyX Login</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <section class="wallet-section">

    <div class="wallet-card">

      <h2>Login To GullyX</h2>

      <p>
        Continue with Google or your mobile number
      </p>

      <br>

      <button
        onclick="googleLogin()"
        style="
        width:100%;
        padding:15px;
        margin-bottom:15px;
        border:none;
        border-radius:14px;
        cursor:pointer;
      ">

        🔵 Continue with Google

      </button>

      <input
        type="text"
        placeholder="Enter Mobile Number"
        style="
        width:100%;
        padding:16px;
        border-radius:14px;
        border:none;
        margin-bottom:18px;
      ">

      <button style="width:100%;">

        Send OTP

      </button>

      <br><br>

      <p>
        By continuing you agree to our Terms & Privacy Policy.
      </p>

    </div>

  </section>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {

      apiKey: "AIzaSyBiI6QHKA1Cl1KgdywBEgTKykpk0Kxltjs",

      authDomain: "gullyx-platform.firebaseapp.com",

      projectId: "gullyx-platform",

      storageBucket: "gullyx-platform.firebasestorage.app",

      messagingSenderId: "257258664695",

      appId: "1:257258664695:web:c9f61f15ea1ba25b8e59f2",

      measurementId: "G-K27PFWGJ6K"

    };

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();

    window.googleLogin = async function () {

      try {

        const result = await signInWithPopup(auth, provider);

        alert("Welcome " + result.user.displayName);

        window.location.href = "index.html";

      }

      catch (error) {

        alert(error.message);

        console.error(error);

      }

    };

  </script>

</body>

</html>
