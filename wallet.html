<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GullyX Wallet</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

 <section class="wallet-section">

  <div class="wallet-card">

    <h2>🎟️ GullyX Wallet</h2>

    <div class="wallet-balance">

      <h1>48 Tokens</h1>

      <p>Available Balance</p>

    </div>

    <div class="token-plans">

      <div class="token-card-plan">

        <h3>Starter Pack</h3>

        <h2>10 Tokens</h2>

        <p>₹40</p>

        <button onclick="window.location.href='payment.html?amount=40'">

          Buy Now

        </button>

      </div>

      <div class="token-card-plan">

        <h3>Casual Pack</h3>

        <h2>15 Tokens</h2>

        <p>₹60</p>

        <button onclick="window.location.href='payment.html?amount=60'">

          Buy Now

        </button>

      </div>

      <div class="token-card-plan best-pack">

        <span class="best-badge">

          BEST VALUE

        </span>

        <h3>Pro Gamer Pack</h3>

        <h2>25 Tokens</h2>

        <p>₹80</p>

        <button onclick="window.location.href='payment.html?amount=80'">

          Save ₹20

        </button>

      </div>

      <div class="token-card-plan premium-pack">

        <span class="best-badge">

          GULLYX PRO

        </span>

        <h3>Unlimited Access</h3>

        <h2>Monthly Membership</h2>

        <p>₹250/month</p>

        <button onclick="window.location.href='payment.html?amount=250'">

          Go Pro

        </button>

      </div>

    </div>

  </div>

</section>

</body>

</html>
