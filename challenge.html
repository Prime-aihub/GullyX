<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GullyX Challenges</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <header class="navbar">

    <div class="logo">
      <span class="blue">Gully</span><span class="green">X</span>
    </div>

  </header>

  <section class="section-title">

    <h2>Daily Challenges</h2>

    <p>
      Compete in fitness streaks and tournaments
    </p>

  </section>

  <section class="games-grid">

    <div class="game-card">

      <h3>30 Pushups Daily</h3>

      <p>🔥 312 Players Joined</p>

      <p>🏆 Reward: 5 Tokens</p>

      <button>Join Challenge</button>

    </div>

    <div class="game-card premium">

      <h3>5KM Running Challenge</h3>

      <p>⚡ Weekly Leaderboard</p>

      <p>🎟️ Reward: 20 Tokens</p>

      <button>Start Challenge</button>

    </div>

  </section>

</body>

</html>
